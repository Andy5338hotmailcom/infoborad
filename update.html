<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>检查更新</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }

        body {
            background: #fff;
            color: #000;
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 220px;
            background: #f5f5f5;
            border-right: 1px solid #ddd;
            padding: 20px 0;
        }

        .sidebar-item {
            padding: 14px 20px;
            cursor: pointer;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

            .sidebar-item:hover {
                background: #e8e8e8;
            }

            .sidebar-item.active {
                background: #007aff;
                color: #fff;
            }

            .sidebar-item img {
                width: 18px;
                height: 18px;
                object-fit: contain;
            }

        .main {
            flex: 1;
            padding: 40px;
        }

        .title {
            font-size: 26px;
            margin-bottom: 30px;
        }

        .box {
            background: #f9f9f9;
            border: 1px solid #eee;
            border-radius: 12px;
            padding: 24px;
        }

        .row {
            margin: 16px 0;
        }

        button {
            padding: 10px 18px;
            background: #007aff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="sidebar-item">
        <img src="setting.svg" alt="">
        设置
    </div>
    <div class="sidebar-item" onclick="window.location.href='set_changelog.html'">
        <img src="txt.png" alt="">
        更新日志
    </div>
    <div class="sidebar-item active">
        <img src="update.png" alt="">
        检查更新
    </div>
    <div class="sidebar-item" onclick="window.location.href='more.html'">
        <img src="home.png" alt="">
        主页
    </div>
</div>

<div class="main">
    <iframe src="justerror.html?code=403&why=功能已禁用，感谢您的理解和支持!" frameborder="0" width="100%" height="100%"></iframe>
</div>
