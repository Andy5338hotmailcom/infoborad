    <!-- Font Awesome -->

    <!-- 统一的 Tailwind 配置 -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        secondary: '#64748b',
                        neutral: '#ffffff',
                        dark: '#1e293b'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif']
                    },
                    boxShadow: {
                        'card': '0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06)'
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .glass-effect {
                background: rgba(241, 245, 249, 0.7);
                backdrop-filter: blur(10px);
                -webkit-backdrop-filter: blur(10px);
            }
            .version-badge {
                @apply inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-primary text-white;
            }
            .changelog-item {
                @apply border-l-4 border-primary pl-4 py-1 mb-2;
            }
            .search-input {
                @apply w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all duration-300;
            }
            .back-button {
                @apply flex items-center px-4 py-2 bg-primary text-white rounded-lg hover:bg-blue-600 transition-all duration-300 shadow-md hover:shadow-lg;
            }
            .version-card {
                @apply bg-white rounded-lg shadow-card p-6 mb-6 transition-all duration-300 hover:shadow-lg;
            }
            .no-results {
                @apply text-center py-10 text-gray-500;
            }
        }
    </style>
</head>
<body class="bg-neutral min-h-screen">

    <main class="container mx-auto px-4 pt-8 pb-8">
        <!-- 更新日志列表 -->
        <div id="changelogList" class="space-y-6">
            <!-- 版本记录将通过 JavaScript 动态生成 -->
        </div>

        <!-- 无结果提示 -->
        <div id="noResults" class="no-results hidden">
            <i class="fa fa-search-minus text-4xl mb-4 block"></i>
            <p class="text-lg">未找到匹配的版本记录</p>
        </div>
    </main>

            {

            {

            {
                version: "build1",
                date: "2026-04-10",
                description: "第一集合版本",
                changes: [
                    "终于把所有都串联起来了！",
                    "反正这样就这样",
                    "就是大集合"
                ]
            }
        ];

        // DOM 元素（删除了返回按钮相关变量）
        const changelogList = document.getElementById('changelogList');
        const noResults = document.getElementById('noResults');

        // 渲染更新日志
        function renderChangelog(versions) {
            changelogList.innerHTML = '';
            
            if (versions.length === 0) {
                noResults.classList.remove('hidden');
                changelogList.classList.add('hidden');
                return;
            }
            
            noResults.classList.add('hidden');
            changelogList.classList.remove('hidden');
            
            versions.forEach(version => {
                const versionCard = document.createElement('div');
                versionCard.className = 'version-card';
                
                versionCard.innerHTML = `
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <span class="version-badge">${version.version}</span>
                            <span class="text-sm text-gray-500 ml-2">${version.date}</span>
                        </div>
                        <button class="toggle-details text-gray-500 hover:text-primary transition-colors">
                            <i class="fa fa-chevron-down"></i>
                        </button>
                    </div>
                    <h3 class="text-xl font-semibold mb-2">${version.description}</h3>
                    <div class="details hidden mt-4 border-t pt-4">
                        <h4 class="font-medium mb-2">更新内容：</h4>
                        <ul class="space-y-2">
                            ${version.changes.map(change => `
                                <li class="changelog-item">
                                    <i class="fa fa-check-circle text-green-500 mr-2"></i>
                                    ${change}
                                </li>
                            `).join('')}
                        </ul>
                    </div>
                `;
                
                changelogList.appendChild(versionCard);
                
                // 添加展开/折叠功能
                const toggleButton = versionCard.querySelector('.toggle-details');
                const details = versionCard.querySelector('.details');
                
                toggleButton.addEventListener('click', () => {
                    details.classList.toggle('hidden');
                    toggleButton.querySelector('i').classList.toggle('fa-chevron-down');
                    toggleButton.querySelector('i').classList.toggle('fa-chevron-up');
                });
            });
        }

        // 初始渲染
        renderChangelog(changelogData);
    </script>
</body>
</html>
